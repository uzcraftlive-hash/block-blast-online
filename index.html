<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Block Blast Online</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: Arial, sans-serif;
    }

    .container {
      background: #1a1a2e;
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      width: 100%;
      max-width: 400px;
    }

    .offline-alert {
      background: #ff4444;
      color: white;
      padding: 15px;
      border-radius: 12px;
      margin-bottom: 20px;
      display: none;
      text-align: center;
      font-weight: bold;
      animation: shake 0.5s;
    }

    .offline-alert.show {
      display: block;
    }

    .online-status {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 15px;
      background: #16213e;
      border-radius: 8px;
      margin-bottom: 15px;
      color: #fff;
      font-size: 14px;
    }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #00ff00;
    }

    .status-dot.offline {
      background: #ff4444;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-10px); }
      75% { transform: translateX(10px); }
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      color: #fff;
    }

    .score {
      font-size: 24px;
      font-weight: bold;
    }

    .best {
      font-size: 14px;
      color: #888;
    }

    .game-board {
      background: #16213e;
      border-radius: 12px;
      padding: 10px;
      margin-bottom: 20px;
      aspect-ratio: 1;
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 8px;
    }

    .cell {
      background: #0f3460;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 24px;
      color: #fff;
      transition: all 0.2s;
      border: 2px solid #0f3460;
    }

    .cell:hover {
      background: #1a4d7a;
    }

    .cell.filled {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border-color: #667eea;
    }

    .cell.filled-2 {
      background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
    }

    .cell.filled-3 {
      background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
    }

    .cell.filled-4 {
      background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);
    }

    .cell.filled-5 {
      background: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
    }

    .next-blocks {
      background: #16213e;
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 20px;
      color: #fff;
    }

    .next-title {
      font-size: 14px;
      margin-bottom: 10px;
      color: #888;
    }

    .preview {
      display: flex;
      gap: 10px;
      margin-bottom: 10px;
    }

    .preview-block {
      background: #0f3460;
      border-radius: 8px;
      width: 60px;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      border: 2px solid #0f3460;
    }

    .preview-block.active {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border-color: #667eea;
    }

    .buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    button {
      padding: 15px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s;
    }

    button:active {
      transform: scale(0.95);
    }

    .new-game {
      background: #00ff00;
      color: #000;
      grid-column: span 2;
    }

    .new-game:hover {
      background: #00dd00;
      transform: scale(1.02);
    }

    .info {
      background: #667eea;
      color: #fff;
    }

    .info:hover {
      background: #5568d3;
    }

    .game-over {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: #1a1a2e;
      padding: 40px;
      border-radius: 20px;
      text-align: center;
      color: #fff;
      z-index: 1000;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
      display: none;
    }

    .game-over.show {
      display: block;
      animation: popIn 0.3s ease;
    }

    @keyframes popIn {
      from {
        transform: translate(-50%, -50%) scale(0.8);
        opacity: 0;
      }
      to {
        transform: translate(-50%, -50%) scale(1);
        opacity: 1;
      }
    }

    .game-over h2 {
      font-size: 32px;
      margin-bottom: 20px;
      color: #ff4444;
    }

    .game-over p {
      font-size: 18px;
      margin-bottom: 30px;
    }

    .game-over button {
      width: 100%;
      padding: 15px;
      background: #00ff00;
      color: #000;
      border: none;
      border-radius: 10px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    .leaderboard {
      background: #16213e;
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 20px;
      color: #fff;
      max-height: 200px;
      overflow-y: auto;
    }

    .leaderboard-title {
      font-size: 14px;
      margin-bottom: 10px;
      color: #888;
      font-weight: bold;
    }

    .leaderboard-item {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid #0f3460;
      font-size: 14px;
    }

    .leaderboard-item:last-child {
      border-bottom: none;
    }

    .rank {
      color: #667eea;
      font-weight: bold;
      min-width: 30px;
    }

    @media (max-width: 480px) {
      .container {
        padding: 15px;
      }

      .cell {
        font-size: 18px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="offline-alert" id="offlineAlert">
      ⚠️ INTERNETINGIZNI YOQING! WiFi yoki Mobile internet kerak!
    </div>

    <div class="online-status">
      <div class="status-dot" id="statusDot"></div>
      <span id="statusText">ONLINE</span>
    </div>

    <div class="header">
      <div>
        <div class="score">Score: <span id="score">0</span></div>
        <div class="best">Best: <span id="best">0</span></div>
      </div>
    </div>

    <div class="game-board" id="gameBoard"></div>

    <div class="leaderboard" id="leaderboard">
      <div class="leaderboard-title">🏆 TOP 10 LIDER</div>
      <div id="leaderboardList"></div>
    </div>

    <div class="next-blocks">
      <div class="next-title">KEYINGI BLOK</div>
      <div class="preview" id="preview"></div>
    </div>

    <div class="buttons">
      <button class="new-game" id="newGameBtn">🎮 YANGI O'YIN</button>
      <button class="info" id="infoBtn">ℹ️ QOL LAMASI</button>
    </div>
  </div>

  <div class="game-over" id="gameOver">
    <h2>🎮 O'YIN TUGADI!</h2>
    <p>Siz <span id="finalScore">0</span> ball to'pladingiz</p>
    <button id="restartBtn">QAYTA O'YNAMIZ</button>
  </div>

  <script>
    const GRID_SIZE = 6;
    let grid = Array(GRID_SIZE * GRID_SIZE).fill(0);
    let score = 0;
    let best = localStorage.getItem('bestScore') || 0;
    let nextBlock = generateRandomBlock();
    let gameActive = true;
    let isOnline = navigator.onLine;

    const colors = ['', 'filled', 'filled-2', 'filled-3', 'filled-4', 'filled-5'];

    console.log("Block Blast o'yini yuklandi!");

    // TUGMALARNI ULASH
    document.getElementById('newGameBtn').addEventListener('click', newGame);
    document.getElementById('restartBtn').addEventListener('click', newGame);
    document.getElementById('infoBtn').addEventListener('click', () => {
      alert('Blokni bo\'yosh kletsada bosing. Qatorni to\'ldirganda yo\'q bo\'ladi! Online o\'yin - har hir tushadigon!');
    });

    // INTERNET TEKSHIRISH
    window.addEventListener('online', () => {
      isOnline = true;
      updateOnlineStatus();
      loadLeaderboard();
      console.log("Internet ulandi!");
    });

    window.addEventListener('offline', () => {
      isOnline = false;
      updateOnlineStatus();
      showOfflineAlert();
      console.log("Internet uzildi!");
    });

    function updateOnlineStatus() {
      const statusDot = document.getElementById('statusDot');
      const statusText = document.getElementById('statusText');
      const offlineAlert = document.getElementById('offlineAlert');

      if (isOnline) {
        statusDot.classList.remove('offline');
        statusText.textContent = '✅ ONLINE';
        offlineAlert.classList.remove('show');
      } else {
        statusDot.classList.add('offline');
        statusText.textContent = '❌ OFFLINE';
        offlineAlert.classList.add('show');
      }
    }

    function showOfflineAlert() {
      const alert = document.getElementById('offlineAlert');
      alert.classList.add('show');
      setTimeout(() => {
        if (!isOnline) {
          alert.classList.remove('show');
        }
      }, 5000);
    }

    // RANDOM BLOCK (HAR HIR TURLI)
    function generateRandomBlock() {
      return Math.floor(Math.random() * 5) + 1;
    }

    function updateDisplay() {
      const gameBoard = document.getElementById('gameBoard');
      gameBoard.innerHTML = '';

      for (let i = 0; i < GRID_SIZE * GRID_SIZE; i++) {
        const cell = document.createElement('div');
        cell.className = 'cell';
        if (grid[i] > 0) {
          cell.classList.add(colors[grid[i] % colors.length]);
          cell.textContent = grid[i];
        }
        
        // KLETKA KLITSIGA ULASH
        cell.addEventListener('click', function() {
          console.log("Kletka bosildi:", i);
          placeBlock(i);
        });
        
        gameBoard.appendChild(cell);
      }

      document.getElementById('score').textContent = score;
      document.getElementById('best').textContent = best;
      updatePreview();
    }

    function updatePreview() {
      const preview = document.getElementById('preview');
      preview.innerHTML = '';
      
      for (let i = 0; i < 3; i++) {
        const block = document.createElement('div');
        block.className = 'preview-block';
        if (i === 0) {
          block.classList.add('active');
          block.textContent = nextBlock;
        }
        preview.appendChild(block);
      }
    }

    function placeBlock(index) {
      console.log("Blok qo'yilmoqda:", index, "Qiymat:", nextBlock, "Ishlatilganmi:", grid[index]);
      
      if (!gameActive || grid[index] !== 0) {
        console.log("Blok qo'yib bo'lmadi - o'yin faol emas yoki kletka to'ldi");
        return;
      }

      grid[index] = nextBlock;
      score += nextBlock * 10;
      console.log("Blok qo'yildi! Yangi ball:", score);

      checkRows();
      checkColumns();
      
      nextBlock = generateRandomBlock();
      console.log("Keyingi blok:", nextBlock);
      
      updateDisplay();

      if (!canPlace()) {
        console.log("O'yin tugadi - joylar yo'q!");
        endGame();
      }
    }

    function checkRows() {
      for (let row = 0; row < GRID_SIZE; row++) {
        const rowStart = row * GRID_SIZE;
        let filled = true;

        for (let col = 0; col < GRID_SIZE; col++) {
          if (grid[rowStart + col] === 0) {
            filled = false;
            break;
          }
        }

        if (filled) {
          console.log("Qator to'ldi:", row);
          for (let col = 0; col < GRID_SIZE; col++) {
            grid[rowStart + col] = 0;
          }
          score += 100;
        }
      }
    }

    function checkColumns() {
      for (let col = 0; col < GRID_SIZE; col++) {
        let filled = true;

        for (let row = 0; row < GRID_SIZE; row++) {
          if (grid[row * GRID_SIZE + col] === 0) {
            filled = false;
            break;
          }
        }

        if (filled) {
          console.log("Ustun to'ldi:", col);
          for (let row = 0; row < GRID_SIZE; row++) {
            grid[row * GRID_SIZE + col] = 0;
          }
          score += 100;
        }
      }
    }

    function canPlace() {
      for (let i = 0; i < grid.length; i++) {
        if (grid[i] === 0) return true;
      }
      return false;
    }

    function endGame() {
      gameActive = false;
      console.log("O'yin tugadi! Akhiriy ball:", score);
      
      if (score > best) {
        best = score;
        localStorage.setItem('bestScore', best);
      }

      if (isOnline) {
        saveScoreToServer();
      }

      document.getElementById('finalScore').textContent = score;
      document.getElementById('gameOver').classList.add('show');
    }

    function saveScoreToServer() {
      const leaderboard = JSON.parse(localStorage.getItem('leaderboard')) || [];
      leaderboard.push({
        name: 'Siz',
        score: score,
        date: new Date().toLocaleString('uz-UZ')
      });
      leaderboard.sort((a, b) => b.score - a.score);
      leaderboard = leaderboard.slice(0, 10);
      localStorage.setItem('leaderboard', JSON.stringify(leaderboard));
      loadLeaderboard();
    }

    function loadLeaderboard() {
      const leaderboard = JSON.parse(localStorage.getItem('leaderboard')) || [];
      const list = document.getElementById('leaderboardList');
      list.innerHTML = '';

      if (leaderboard.length === 0) {
        list.innerHTML = '<div style="color: #888;">Hali lider yo\'q</div>';
        return;
      }

      leaderboard.forEach((item, index) => {
        const div = document.createElement('div');
        div.className = 'leaderboard-item';
        div.innerHTML = `
          <span><span class="rank">#${index + 1}</span> ${item.name}</span>
          <span>🏆 ${item.score}</span>
        `;
        list.appendChild(div);
      });
    }

    function newGame() {
      console.log("Yangi o'yin boshlanmoqda...");
      grid = Array(GRID_SIZE * GRID_SIZE).fill(0);
      score = 0;
      gameActive = true;
      nextBlock = generateRandomBlock();
      document.getElementById('gameOver').classList.remove('show');
      updateDisplay();
    }

    // BOSHLANG'ICH
    console.log("O'yin boshlandi!");
    updateOnlineStatus();
    loadLeaderboard();
    updateDisplay();
  </script>
</body>
</html>
